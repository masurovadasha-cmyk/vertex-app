name: VERTEX VISION Foundation CI
on:
  push:
    branches: ['vision-foundation-*']
  pull_request:
    branches: [master]
    paths:
      - 'vision/**'
      - 'docs/architecture/**'
      - 'package.json'
      - '.github/workflows/vision-foundation-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vision_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
      - name: Existing Vertex plus VISION foundation tests
        run: npm test
      - name: PostgreSQL RLS isolation and concurrent transactions
        run: node --test vision/tests/database.test.mjs
        env:
          VISION_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@localhost:5432/vision_test_ci
      - name: Cloudflare compatibility dry-run
        run: npm run check:deploy
      - name: Separate VISION staging build without deployment
        run: npx wrangler deploy --config vision/wrangler.jsonc --dry-run
      - name: Foundation safety assertions
        run: |
          test -f vision/database/migrations/0001_vision_foundation.sql
          test -f vision/contracts/events-v1.json
          test -f vision/module-sdk/module-contract-v1.json
          node vision/tools/check-seeds.cjs

