name: VERTEX VISION Production Backup Restore Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-vision-production-backup-restore
  cancel-in-progress: false

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vision_production_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_production_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VISION_PRODUCTION_READONLY_DATABASE_URL: ${{ secrets.VISION_PRODUCTION_READONLY_DATABASE_URL }}
      VISION_EXPECTED_PRODUCTION_DATABASE_HOST: ${{ vars.VISION_EXPECTED_PRODUCTION_DATABASE_HOST }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install verification dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          mkdir -p artifacts/production-backup

      - name: Validate read-only production backup principal
        run: node vision/production/check-backup-principal.mjs artifacts/production-backup/principal.json

      - name: Read-only production preflight
        env:
          VISION_RELEASE_TARGET: production
          VISION_RELEASE_DATABASE_URL: ${{ secrets.VISION_PRODUCTION_READONLY_DATABASE_URL }}
          VISION_EXPECTED_DATABASE_HOST: ${{ vars.VISION_EXPECTED_PRODUCTION_DATABASE_HOST }}
        run: node vision/production/preflight.mjs artifacts/production-backup/source-preflight.json

      - name: Create encrypted-in-transit PostgreSQL backup and restore only into CI database
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec -e SOURCE_DATABASE_URL="$VISION_PRODUCTION_READONLY_DATABASE_URL" "$PG_CONTAINER"             sh -c 'pg_dump "$SOURCE_DATABASE_URL" -Fc --no-owner --no-acl -f /tmp/vision-production.dump'
          docker exec "$PG_CONTAINER" sha256sum /tmp/vision-production.dump | awk '{print $1}' > artifacts/production-backup/backup-sha256.txt
          docker exec -e PGPASSWORD=disposable-ci-only "$PG_CONTAINER" dropdb -U postgres --if-exists vision_production_restore
          docker exec -e PGPASSWORD=disposable-ci-only "$PG_CONTAINER" createdb -U postgres vision_production_restore
          docker exec -e PGPASSWORD=disposable-ci-only "$PG_CONTAINER"             pg_restore -U postgres -d vision_production_restore --no-owner --exit-on-error /tmp/vision-production.dump

      - name: Verify restored pre-migration production state
        env:
          VISION_RESTORED_DATABASE_URL: postgres://postgres:disposable-ci-only@localhost:5432/vision_production_restore
        run: node vision/production/verify-production-restore.mjs artifacts/production-backup/restore-verification.json

      - name: Build sanitized backup/restore evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('artifacts/production-backup/source-preflight.json','utf8'));
          const restore=JSON.parse(fs.readFileSync('artifacts/production-backup/restore-verification.json','utf8'));
          const release=JSON.parse(fs.readFileSync('vision/release/0.1-RC1.json','utf8'));
          const backupSha=fs.readFileSync('artifacts/production-backup/backup-sha256.txt','utf8').trim();
          if(!/^[a-f0-9]{64}$/.test(backupSha))throw Error('Invalid backup digest');
          if(source.latestApplied!==restore.restoredLatestMigration)throw Error('Backup/restore migration version mismatch');
          if(restore.targetMigration!==release.databaseMigration)throw Error('Restore target migration mismatch');
          const report={
            status:'PASS',
            target:'production',
            sourceCommit:process.env.GITHUB_SHA,
            targetMigration:release.databaseMigration,
            backupSourceLatestMigration:source.latestApplied,
            restoredLatestMigration:restore.restoredLatestMigration,
            backupCreated:true,
            restoreVerified:true,
            migrationPrefixVerified:restore.migrationPrefixVerified===true,
            readOnlyPrincipalVerified:true,
            backupSha256:backupSha,
            productionChanged:false
          };
          fs.writeFileSync('artifacts/production-backup/production-backup-restore.json',JSON.stringify(report,null,2)+'\n');
          JS

      - name: Destroy backup bytes before artifact upload
        if: always()
        shell: bash
        run: |
          set +e
          PG_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          if [ -n "$PG_CONTAINER" ]; then docker exec "$PG_CONTAINER" rm -f /tmp/vision-production.dump; fi
          rm -f artifacts/production-backup/backup-sha256.txt
          test ! -e artifacts/production-backup/backup-sha256.txt

      - name: Ensure evidence contains no database URL or bearer-like secrets
        run: |
          set -euo pipefail
          if grep -R -E 'postgres(ql)?://|Bearer [A-Za-z0-9_.-]{20,}|sb_(secret|publishable)_' artifacts/production-backup; then
            echo "Sensitive value detected in production backup evidence" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Vertex-Vision-Production-Backup-Restore-${{ github.sha }}
          path: |
            artifacts/production-backup/principal.json
            artifacts/production-backup/restore-verification.json
            artifacts/production-backup/production-backup-restore.json
          retention-days: 30
          if-no-files-found: error
