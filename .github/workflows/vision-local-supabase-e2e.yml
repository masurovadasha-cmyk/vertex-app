name: VERTEX VISION Local Supabase Auth E2E

on:
  push:
    branches: ['vision-rc-local-supabase-e2e-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install project dependencies
        run: |
          set -euo pipefail
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          mkdir -p artifacts/local-supabase .vision-supabase
      - name: Prove runtime matches immutable RC candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 57bd9cee2d293e56313ddc0b9e0ea3a01ff0d642 --depth=1
          changed="$(git diff --name-only 57bd9cee2d293e56313ddc0b9e0ea3a01ff0d642 HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/vision-local-supabase-e2e.yml' 'vision/staging/local-supabase-e2e.mjs' | sort)"
          test "$changed" = "$expected"
      - name: Start pinned local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd .vision-supabase
          npx --yes supabase@2.119.0 init
          npx --yes supabase@2.119.0 start
          STATUS_ENV="$(npx --yes supabase@2.119.0 status -o env)"
          eval "$STATUS_ENV"
          LOCAL_ANON="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          LOCAL_SERVICE="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "${DB_URL:-}"
          test -n "$LOCAL_ANON"
          test -n "$LOCAL_SERVICE"
          {
            echo "LOCAL_SUPABASE_API_URL=$API_URL"
            echo "LOCAL_SUPABASE_DB_URL=$DB_URL"
            echo "LOCAL_SUPABASE_ANON_KEY=$LOCAL_ANON"
            echo "LOCAL_SUPABASE_SERVICE_KEY=$LOCAL_SERVICE"
            echo "VISION_CANDIDATE_SHA=57bd9cee2d293e56313ddc0b9e0ea3a01ff0d642"
          } >> "$GITHUB_ENV"
      - name: Run genuine local Supabase Auth, Worker and direct-RLS E2E
        run: node vision/staging/local-supabase-e2e.mjs artifacts/local-supabase/e2e.json
      - name: Verify sanitized evidence
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('artifacts/local-supabase/e2e.json','utf8'));
          if(report.status!=='passed'||report.syntheticOnly!==true||report.backend!=='local-supabase'||report.productionChanged!==false)throw Error('invalid local E2E report');
          if(!Array.isArray(report.checks)||report.checks.length<20)throw Error('incomplete local E2E evidence');
          JS
      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          cd .vision-supabase
          npx --yes supabase@2.119.0 stop --no-backup || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Vertex-Vision-Local-Supabase-E2E-${{ github.sha }}
          path: artifacts/local-supabase/
          retention-days: 30
          if-no-files-found: error
