name: VERTEX VISION Real Staging Auth E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-vision-real-staging-e2e
  cancel-in-progress: false

jobs:
  cloud-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
      VISION_STAGING_URL: ${{ vars.VISION_STAGING_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Validate staging-only configuration without printing secrets
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VISION_STAGING_DATABASE_URL: ${{ secrets.VISION_STAGING_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VISION_E2E_GUEST_EMAIL: ${{ secrets.VISION_E2E_GUEST_EMAIL }}
          VISION_E2E_GUEST_PASSWORD: ${{ secrets.VISION_E2E_GUEST_PASSWORD }}
          VISION_E2E_VIEWS_EMAIL: ${{ secrets.VISION_E2E_VIEWS_EMAIL }}
          VISION_E2E_VIEWS_PASSWORD: ${{ secrets.VISION_E2E_VIEWS_PASSWORD }}
          VISION_E2E_DISPATCHER_EMAIL: ${{ secrets.VISION_E2E_DISPATCHER_EMAIL }}
          VISION_E2E_DISPATCHER_PASSWORD: ${{ secrets.VISION_E2E_DISPATCHER_PASSWORD }}
          VISION_E2E_STAFF_EMAIL: ${{ secrets.VISION_E2E_STAFF_EMAIL }}
          VISION_E2E_STAFF_PASSWORD: ${{ secrets.VISION_E2E_STAFF_PASSWORD }}
          VISION_E2E_QUALITY_EMAIL: ${{ secrets.VISION_E2E_QUALITY_EMAIL }}
          VISION_E2E_QUALITY_PASSWORD: ${{ secrets.VISION_E2E_QUALITY_PASSWORD }}
          VISION_E2E_AUDIT_EMAIL: ${{ secrets.VISION_E2E_AUDIT_EMAIL }}
          VISION_E2E_AUDIT_PASSWORD: ${{ secrets.VISION_E2E_AUDIT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const required=[
            'SUPABASE_STAGING_REF','SUPABASE_PUBLISHABLE_KEY','VISION_STAGING_DATABASE_URL',
            'VISION_STAGING_URL','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID',
            'VISION_E2E_GUEST_EMAIL','VISION_E2E_GUEST_PASSWORD',
            'VISION_E2E_VIEWS_EMAIL','VISION_E2E_VIEWS_PASSWORD',
            'VISION_E2E_DISPATCHER_EMAIL','VISION_E2E_DISPATCHER_PASSWORD',
            'VISION_E2E_STAFF_EMAIL','VISION_E2E_STAFF_PASSWORD',
            'VISION_E2E_QUALITY_EMAIL','VISION_E2E_QUALITY_PASSWORD',
            'VISION_E2E_AUDIT_EMAIL','VISION_E2E_AUDIT_PASSWORD'
          ];
          const missing=required.filter(name=>!process.env[name]);
          const report={sourceCommit:process.env.GITHUB_SHA,missing,productionChanged:false};
          fs.writeFileSync('artifacts/staging/preflight.json',JSON.stringify(report,null,2)+'\n');
          if(missing.length)throw Error('Missing staging configuration: '+missing.join(', '));
          const worker=new URL(process.env.VISION_STAGING_URL);
          if(worker.protocol!=='https:'||worker.hostname!=='vertex-vision-staging.masurovadasha.workers.dev'||worker.pathname!=='/'||worker.search||worker.hash)throw Error('Unsafe staging Worker URL');
          if(!/^[a-z0-9]{20}$/.test(process.env.SUPABASE_STAGING_REF))throw Error('Invalid Supabase staging ref');
          const wrangler=JSON.parse(fs.readFileSync('vision/wrangler.jsonc','utf8'));
          if(wrangler.name!=='vertex-vision-staging'||wrangler.vars?.VISION_ENV!=='staging')throw Error('Unsafe Wrangler target');
          JS

      - name: Install pinned application dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile

      - name: Verify source before any cloud mutation
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/staging/source-tests.txt
          npm run assemble:vision 2>&1 | tee artifacts/staging/assembly.txt
          npx wrangler deploy --config vision/wrangler.jsonc --dry-run --outdir artifacts/staging/worker-dry-run 2>&1 | tee artifacts/staging/worker-dry-run.txt

      - name: Apply checksum-tracked migrations and map real synthetic Auth identities
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VISION_STAGING_DATABASE_URL: ${{ secrets.VISION_STAGING_DATABASE_URL }}
          VISION_E2E_GUEST_EMAIL: ${{ secrets.VISION_E2E_GUEST_EMAIL }}
          VISION_E2E_GUEST_PASSWORD: ${{ secrets.VISION_E2E_GUEST_PASSWORD }}
          VISION_E2E_VIEWS_EMAIL: ${{ secrets.VISION_E2E_VIEWS_EMAIL }}
          VISION_E2E_VIEWS_PASSWORD: ${{ secrets.VISION_E2E_VIEWS_PASSWORD }}
          VISION_E2E_DISPATCHER_EMAIL: ${{ secrets.VISION_E2E_DISPATCHER_EMAIL }}
          VISION_E2E_DISPATCHER_PASSWORD: ${{ secrets.VISION_E2E_DISPATCHER_PASSWORD }}
          VISION_E2E_STAFF_EMAIL: ${{ secrets.VISION_E2E_STAFF_EMAIL }}
          VISION_E2E_STAFF_PASSWORD: ${{ secrets.VISION_E2E_STAFF_PASSWORD }}
          VISION_E2E_QUALITY_EMAIL: ${{ secrets.VISION_E2E_QUALITY_EMAIL }}
          VISION_E2E_QUALITY_PASSWORD: ${{ secrets.VISION_E2E_QUALITY_PASSWORD }}
          VISION_E2E_AUDIT_EMAIL: ${{ secrets.VISION_E2E_AUDIT_EMAIL }}
          VISION_E2E_AUDIT_PASSWORD: ${{ secrets.VISION_E2E_AUDIT_PASSWORD }}
        run: |
          set -euo pipefail
          export SUPABASE_URL="https://${SUPABASE_STAGING_REF}.supabase.co"
          node vision/staging/provision.mjs artifacts/staging/provision.json

      - name: Deploy only the dedicated staging Worker with public Supabase configuration
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export SUPABASE_URL="https://${SUPABASE_STAGING_REF}.supabase.co"
          npx wrangler deploy --config vision/wrangler.jsonc --keep-vars \
            --var "VISION_SOURCE_COMMIT:$GITHUB_SHA" \
            --var "SUPABASE_STAGING_REF:$SUPABASE_STAGING_REF" \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY" \
            2>&1 | tee artifacts/staging/deploy.txt

      - name: Verify deployed source and runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          base="${VISION_STAGING_URL%/}"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/health" -o artifacts/staging/health.json
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/readyz" -o artifacts/staging/readiness.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const release=JSON.parse(fs.readFileSync('vision/release/0.1-RC1.json','utf8'));
          const health=JSON.parse(fs.readFileSync('artifacts/staging/health.json','utf8'));
          const ready=JSON.parse(fs.readFileSync('artifacts/staging/readiness.json','utf8'));
          if(health.service!=='VERTEX VISION'||health.environment!=='staging'||health.configured!==true||health.sourceCommit!==process.env.GITHUB_SHA)throw Error('Deployed source/config mismatch');
          if(health.requiredMigration!==release.databaseMigration||health.architectureVersion!==release.architectureVersion)throw Error('Health release mismatch');
          if(ready.ready!==true||ready.latestMigration!==release.databaseMigration||ready.architectureVersion!==release.architectureVersion)throw Error('Database not ready');
          JS

      - name: Run genuine Supabase Auth, Worker and direct-RLS E2E
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VISION_E2E_GUEST_EMAIL: ${{ secrets.VISION_E2E_GUEST_EMAIL }}
          VISION_E2E_GUEST_PASSWORD: ${{ secrets.VISION_E2E_GUEST_PASSWORD }}
          VISION_E2E_VIEWS_EMAIL: ${{ secrets.VISION_E2E_VIEWS_EMAIL }}
          VISION_E2E_VIEWS_PASSWORD: ${{ secrets.VISION_E2E_VIEWS_PASSWORD }}
          VISION_E2E_STAFF_EMAIL: ${{ secrets.VISION_E2E_STAFF_EMAIL }}
          VISION_E2E_STAFF_PASSWORD: ${{ secrets.VISION_E2E_STAFF_PASSWORD }}
          VISION_E2E_QUALITY_EMAIL: ${{ secrets.VISION_E2E_QUALITY_EMAIL }}
          VISION_E2E_QUALITY_PASSWORD: ${{ secrets.VISION_E2E_QUALITY_PASSWORD }}
        run: |
          set -euo pipefail
          export SUPABASE_URL="https://${SUPABASE_STAGING_REF}.supabase.co"
          node vision/staging/cloud-e2e.mjs artifacts/staging/provision.json artifacts/staging/cloud-e2e.json

      - name: Record cloud gate result
        if: always()
        shell: bash
        run: |
          {
            echo "## VERTEX VISION Real Staging Auth E2E"
            echo "- Source: `$GITHUB_SHA`"
            echo "- Target Worker: `vertex-vision-staging`"
            echo "- Production/master changed: **no**"
            if test -f artifacts/staging/cloud-e2e.json; then
              echo "- Authenticated cloud E2E report: generated"
            else
              echo "- Authenticated cloud E2E report: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Vertex-Vision-Real-Staging-E2E-${{ github.sha }}
          path: artifacts/staging/
          retention-days: 30
          if-no-files-found: error
