name: Vertex JARVIS CI

on:
  push:
    branches:
      - vertex-jarvis-foundation
    paths:
      - "vertex-jarvis/**"
      - ".github/workflows/jarvis-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "vertex-jarvis/**"
      - ".github/workflows/jarvis-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static safety checks
        run: node vertex-jarvis/scripts/check-safety.mjs

      - name: Wrangler dry run
        run: pnpm exec wrangler deploy --dry-run --config vertex-jarvis/wrangler.jsonc
