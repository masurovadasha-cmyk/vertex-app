name: Build Vertex Android APK

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to build
        required: true
        type: string
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - 'vision/platform/**'
      - 'scripts/check-android-sync.cjs'
      - '.github/workflows/build-android-apk.yml'
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'vertex/dist/**'
      - 'vertex/tools/**'
      - 'vision/platform/**'
      - 'scripts/sync-android.cjs'
      - 'scripts/check-android-sync.cjs'
      - 'package.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read
concurrency:
  group: vertex-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VISION_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.VISION_CANDIDATE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install web test dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
      - name: Verify unified release and synchronize generated Android assets
        run: |
          npm test
          node scripts/check-android-sync.cjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify package, signature and exact embedded files
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-apk/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > release-apk/apk-badging.txt
          grep -q "package: name='com.vertex.vision.demo'" release-apk/apk-badging.txt
          grep -q "versionCode='22'" release-apk/apk-badging.txt
          grep -q "versionName='1.18-rc1'" release-apk/apk-badging.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              root = Path('android/app/src/main/assets/site')
              for file in root.rglob('*'):
                  if file.is_file():
                      assert apk.read('assets/site/'+file.relative_to(root).as_posix()) == file.read_bytes(), str(file)
          Path('release-apk/apk-assets.txt').write_text('PASS: every embedded web asset matches the generated, synchronization-checked source.\nNative Android runtime is not tested by this job.\n')
          PY
          cp "$APK" release-apk/Vertex-Vision-1.18-rc1-code22.apk
          (cd release-apk && sha256sum Vertex-Vision-1.18-rc1-code22.apk > SHA256SUMS.txt)
          test "$(git rev-parse HEAD)" = "$VISION_CANDIDATE_SHA"
          printf '%s\n' "$VISION_CANDIDATE_SHA" > release-apk/source-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Vertex-Vision-1.18-rc1-code22-${{ env.VISION_CANDIDATE_SHA }}
          path: release-apk/
          if-no-files-found: error
          retention-days: 30
