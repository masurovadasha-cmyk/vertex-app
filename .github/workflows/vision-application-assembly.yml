name: VERTEX VISION Application Assembly
on:
  push:
    branches: ['vision-application-assembly-*']
  pull_request:
    branches: ['vision-auth-staging-*']
    paths:
      - 'vision/**'
      - 'docs/architecture/APPLICATION-ASSEMBLY-0.1.md'
      - '.github/workflows/vision-application-assembly.yml'
permissions:
  contents: read
concurrency:
  group: vision-application-assembly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vision_test_assembly
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full source and release regressions
        run: npm test
      - name: PostgreSQL 17 full migration/RLS gate
        run: node --test vision/tests/database.test.mjs
        env:
          VISION_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@localhost:5432/vision_test_assembly
      - name: Auth, assembly and operations contract tests
        run: node --test vision/tests/auth-*.test.mjs vision/tests/operations-*.test.mjs
      - name: Full VISION Hub to Views browser journey
        run: node vision/tools/verify-operations-ui.mjs
      - name: Cloudflare unified staging Worker dry-run
        run: npx wrangler deploy --config vision/wrangler.jsonc --dry-run
      - name: Deploy dedicated VISION staging Worker when Cloudflare credentials exist
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dedicated VISION staging deployment skipped: Cloudflare staging credentials are not configured."
            exit 0
          fi
          npx wrangler deploy --config vision/wrangler.jsonc --keep-vars
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify assembled staging shell when deployment URL is configured
        if: steps.deploy.outputs.deployed == 'true'
        shell: bash
        env:
          VISION_STAGING_URL: ${{ vars.VISION_STAGING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VISION_STAGING_URL:-}" ]; then
            echo "::notice::Worker deployed but VISION_STAGING_URL is missing; external shell verification skipped."
            exit 0
          fi
          base="${VISION_STAGING_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/healthz" > assembly-health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/vision/v1/modules" > assembly-modules.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/" > assembly-root.html
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('assembly-health.json'));const m=JSON.parse(fs.readFileSync('assembly-modules.json'));const html=fs.readFileSync('assembly-root.html','utf8');if(h.service!=='VERTEX VISION'||h.activeModule!=='views'||m.modules?.length!==19||m.modules.filter(x=>x.status==='active').map(x=>x.id).join(',')!=='views'||!html.includes('Одна платформа.'))process.exit(1)"
      - name: Genuine Supabase/Cloudflare staging E2E when configured
        run: node vision/tools/verify-cloud-auth.mjs
        env:
          VISION_STAGING_URL: ${{ vars.VISION_STAGING_URL }}
          VISION_TEST_MANAGER_EMAIL: ${{ secrets.VISION_TEST_MANAGER_EMAIL }}
          VISION_TEST_MANAGER_PASSWORD: ${{ secrets.VISION_TEST_MANAGER_PASSWORD }}
          VISION_TEST_CLEANER_EMAIL: ${{ secrets.VISION_TEST_CLEANER_EMAIL }}
          VISION_TEST_CLEANER_PASSWORD: ${{ secrets.VISION_TEST_CLEANER_PASSWORD }}
          VISION_TEST_QUALITY_EMAIL: ${{ secrets.VISION_TEST_QUALITY_EMAIL }}
          VISION_TEST_QUALITY_PASSWORD: ${{ secrets.VISION_TEST_QUALITY_PASSWORD }}
          VISION_TEST_CUSTOMER_ID: ${{ vars.VISION_TEST_CUSTOMER_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-application-assembly-evidence-${{ github.sha }}
          path: |
            .vision-build/operations-ui-evidence/
            .vision-build/auth-staging-evidence/
          if-no-files-found: warn
          retention-days: 14
