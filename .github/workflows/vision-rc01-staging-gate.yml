name: VERTEX VISION RC 0.1 Staging Gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'vision/**'
      - 'package.json'
      - '.github/workflows/vision-rc01-staging-gate.yml'
      - 'docs/release/VISION-RC-0.1-STAGING-GATE.md'
  workflow_dispatch:
    inputs:
      authenticated:
        description: 'Run the real Supabase + Cloudflare staging gate'
        required: true
        type: boolean
        default: false
      apply_migrations:
        description: 'Apply pending VISION migrations to the pinned staging database'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vision-rc01-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Deterministic preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vision_test_rc01
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
      - name: Full repository regression suite
        run: npm test
      - name: PostgreSQL 17 migration, RLS and concurrency suite
        run: node --test vision/tests/database.test.mjs
        env:
          VISION_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@localhost:5432/vision_test_rc01
      - name: Main Worker dry-run
        run: npm run check:deploy
      - name: Separate VISION staging Worker dry-run
        run: npx wrangler deploy --config vision/wrangler.jsonc --dry-run
      - name: Refuse accidental mutation without explicit staging opt-in
        run: |
          if VISION_APPLY_STAGING_MIGRATIONS=NO node vision/tools/staging-migrate.mjs 2>guard.txt; then
            echo "migration guard unexpectedly allowed a write"
            exit 1
          fi
          grep -q "Refusing to mutate staging" guard.txt

  authenticated-staging:
    name: Authenticated Supabase + Cloudflare staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authenticated == true }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vision-staging
    env:
      SUPABASE_STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VISION_STAGING_DATABASE_URL: ${{ secrets.VISION_STAGING_DATABASE_URL }}
      VISION_STAGING_URL: ${{ vars.VISION_STAGING_URL }}
      VISION_STAGING_BEARER_TOKEN: ${{ secrets.VISION_STAGING_BEARER_TOKEN }}
      VISION_STAGING_TENANT_ID: ${{ vars.VISION_STAGING_TENANT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
      - name: Validate pinned staging targets without printing credentials
        run: node vision/tools/staging-config.mjs --database --worker
      - name: Apply immutable migrations to staging
        if: ${{ inputs.apply_migrations == true }}
        run: node vision/tools/staging-migrate.mjs
        env:
          VISION_APPLY_STAGING_MIGRATIONS: YES_APPLY_STAGING
      - name: Deploy only the separate staging Worker
        run: |
          npx wrangler deploy --config vision/wrangler.jsonc             --var "VISION_ENV:staging"             --var "SUPABASE_STAGING_REF:${SUPABASE_STAGING_REF}"             --var "SUPABASE_URL:${SUPABASE_URL}"             --var "SUPABASE_PUBLISHABLE_KEY:${SUPABASE_PUBLISHABLE_KEY}"
      - name: Verify staging health and authorization boundaries
        run: node vision/tools/staging-http-smoke.mjs
