name: Deploy Vertex to Cloudflare

on:
  push:
    branches: [master]
    paths:
      - "vertex/dist/**"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify release before deploy
        run: npm test

      - name: Require Cloudflare token
        shell: bash
        run: |
          TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Cloudflare deploy token is missing. Add GitHub Actions secret CLOUDFLARE_API_TOKEN (preferred) or CF_API_TOKEN with Workers Scripts:Edit permission for account b3aa874550f12baee308e3e7b4dba309."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy existing vertex-app Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify public release
        shell: bash
        run: |
          EXPECTED="$(node -p "require('./vertex/dist/release.json').version")"
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 20 https://vertex-app.masurovadasha.workers.dev/release.json || true)"
            ACTUAL="$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})")"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "Public release verified: $ACTUAL"
              exit 0
            fi
            echo "Attempt $attempt: expected $EXPECTED, got ${ACTUAL:-no-version}; retrying..."
            sleep 10
          done
          echo "::error::Cloudflare deploy command completed but public release.json did not reach the expected version."
          exit 1
