name: VISION Fullstack Sand Integration
on:
  push:
    branches: [vision-fullstack-sand-20260930]
permissions:
  contents: read
concurrency:
  group: vision-fullstack-sand
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vision_test_fullstack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install without cloud credentials
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium
      - name: Verify application contracts and assembly
        run: |
          set -o pipefail
          mkdir -p artifacts/fullstack
          npm test 2>&1 | tee artifacts/fullstack/tests.txt
          npm run assemble:vision 2>&1 | tee artifacts/fullstack/assembly.txt
          node scripts/check-android-sync.cjs
      - name: Native PostgreSQL concurrency and data invariants
        run: |
          set -o pipefail
          node --test vision/tests/database.test.mjs 2>&1 | tee artifacts/fullstack/postgresql.txt
          node --test vision/tests/next-stage.test.mjs 2>&1 | tee artifacts/fullstack/postgresql-next.txt
        env:
          VISION_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@localhost:5432/vision_test_fullstack
      - name: Preserved browsers and approved Sand design
        run: |
          python scripts/browser-quality.py
          python scripts/browser-studio.py
          python scripts/browser-taxi.py
          python scripts/browser-web-red.py
          python scripts/browser-vision.py
          python scripts/browser-sand-design.py
      - name: New design through staging handler and actual SQL with synthetic Auth
        run: python scripts/browser-fullstack-sand.py
      - name: Compile both Worker configurations without publishing
        run: |
          set -o pipefail
          npm run check:deploy 2>&1 | tee artifacts/fullstack/public-dry-run.txt
          npx wrangler deploy --config vision/wrangler.jsonc --dry-run --outdir artifacts/fullstack/worker 2>&1 | tee artifacts/fullstack/staging-dry-run.txt
      - name: Create exact interactive preview
        run: node scripts/package-canva.cjs
      - name: Export source and evidence with no secrets or font binaries
        if: always()
        run: |
          mkdir -p artifacts/fullstack
          python - <<'PY'
          import subprocess, zipfile, hashlib, json
          from pathlib import Path
          excluded={'.ttf','.otf','.woff','.woff2','.ttc','.eot','.pem','.key','.jks','.keystore','.apk','.zip'}
          with zipfile.ZipFile('artifacts/fullstack/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  p=Path(name)
                  if name and p.suffix.lower() not in excluded and p.name not in {'.env','.dev.vars','local.properties'}:
                      z.writestr(name,subprocess.check_output(['git','show','HEAD:'+name]))
          info={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'cloudAuthVerified':False,'productionChanged':False}
          info['files']={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('artifacts').rglob('*') if p.is_file() and p.suffix.lower() not in excluded}
          Path('artifacts/fullstack/evidence.json').write_text(json.dumps(info,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-fullstack-sand-${{ github.sha }}
          path: |
            artifacts/fullstack/
            artifacts/fullstack-browser/
            artifacts/design/
            artifacts/vision/
            artifacts/quality/
            artifacts/studio/
            artifacts/assembly/
            artifacts/Vertex-Canva-Latest.html
          retention-days: 14
          if-no-files-found: error
