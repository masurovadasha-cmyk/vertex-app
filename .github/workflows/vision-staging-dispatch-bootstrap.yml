name: VERTEX VISION Staging Dispatch Bootstrap

on:
  push:
    branches: [master]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ contains(github.event.head_commit.message, '[vision-staging-dispatch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted real staging workflow
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: 57bd9cee2d293e56313ddc0b9e0ea3a01ff0d642
        run: |
          set -euo pipefail
          gh workflow run vision-cloud-e2e.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f candidate_sha="$CANDIDATE_SHA"
