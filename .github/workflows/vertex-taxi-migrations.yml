name: Vertex Taxi Migration Preflight

on:
  push:
    branches: [vertex-taxi-core-railway-staging]
    paths:
      - 'vertex-taxi-core-railway/migrations/**'
      - '.github/workflows/vertex-taxi-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vertex
          POSTGRES_PASSWORD: vertex
          POSTGRES_DB: vertex_taxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex -d vertex_taxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: vertex
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for f in vertex-taxi-core-railway/migrations/*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U vertex -d vertex_taxi -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Verify critical schema
        run: |
          psql -h 127.0.0.1 -U vertex -d vertex_taxi -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='taxi_rides') THEN RAISE EXCEPTION 'taxi_rides missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='taxi_offers') THEN RAISE EXCEPTION 'taxi_offers missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='taxi_offers' AND column_name='fencing_token') THEN RAISE EXCEPTION 'fencing_token missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name='taxi_notification_outbox') THEN RAISE EXCEPTION 'notification outbox missing'; END IF;
          END $$;
          SQL
