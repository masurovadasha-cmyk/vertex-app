name: Deploy Vertex to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "vertex/dist/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: vertex-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm test

      - name: Verify Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository/environment secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository/environment secret"; exit 1; }
          npx wrangler whoami

      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vertex-app.masurovadasha.workers.dev/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "$URL" -o /tmp/vertex-index.html; then
              grep -qi "vertex" /tmp/vertex-index.html
              echo "Production smoke test passed: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production smoke test failed after deployment"
          exit 1
