name: Vertex CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Check Vertex App Worker
        run: npm run check:deploy
      - name: Check Vertex JARVIS Worker
        run: npm run jarvis:check
