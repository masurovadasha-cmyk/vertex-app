name: Vertex Taxi Cloudflare Edge CI

on:
  push:
    branches: [vertex-taxi-core-railway-staging]
    paths:
      - 'vertex-taxi-edge-cloudflare/**'
      - '.github/workflows/vertex-taxi-edge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run edge unit tests
        working-directory: vertex-taxi-edge-cloudflare
        run: node --test test/*.test.mjs
