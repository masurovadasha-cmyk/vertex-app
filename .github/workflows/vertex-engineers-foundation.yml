name: VERTEX Engineers Foundation CI

on:
  push:
    branches:
      - "vertex-engineers-*"
    paths:
      - "vertex-engineers/**"
      - ".github/workflows/vertex-engineers-foundation.yml"
  pull_request:
    paths:
      - "vertex-engineers/**"
      - ".github/workflows/vertex-engineers-foundation.yml"

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertex-engineers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Verify integrated UI preview
        run: |
          test -f ui/app/index.html
          test -f ui/app/engineers.css
          test -f ui/app/engineers.js
      - name: Upload Engineers UI preview
        uses: actions/upload-artifact@v4
        with:
          name: vertex-engineers-ui-preview
          path: vertex-engineers/ui/app/
          if-no-files-found: error
          retention-days: 30
