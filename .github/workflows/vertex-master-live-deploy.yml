name: VERTEX master live deploy

on:
  push:
    branches: [master]
    paths:
      - 'vertex/**'
      - 'vision/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/vertex-master-live-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-master-live-deploy
  cancel-in-progress: false

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium
      - name: Verify source before production publish
        run: |
          npm test
          node scripts/check-android-sync.cjs
          python scripts/browser-vision.py
          npm run check:deploy
      - name: Publish exact source or wait for Cloudflare GitHub App
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"; then
            echo "mode=wrangler" >> "$GITHUB_OUTPUT"
            npx wrangler deploy --config wrangler.jsonc --keep-vars
          else
            echo "mode=github-app" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy secrets are not configured; waiting for the installed Cloudflare GitHub App deployment."
          fi
      - name: Verify live master release matches this exact source
        env:
          VERTEX_LIVE_MAX_ATTEMPTS: "60"
          VERTEX_LIVE_WAIT_SECONDS: "8"
        run: python scripts/browser-vision.py --live
