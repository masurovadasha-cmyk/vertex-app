name: Prepare and verify red Host Studio with Vertex Taxi
on:
  push:
    branches: [studio-red-taxi-20260929]
    paths: ['.ci/red-taxi/**', '.github/workflows/apply-studio-red-taxi.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'masurovadasha-cmyk/vertex-app' && github.ref == 'refs/heads/studio-red-taxi-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed source without overwriting concurrent work
        run: |
          python .ci/red-taxi/apply.py
          npm run sync:android
      - name: Install verification tools
        run: |
          npm install
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium
      - name: Verify all existing and new functionality
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          npm test 2>&1 | tee artifacts/quality/taxi-unit-server.log
          python scripts/browser-quality.py
          python scripts/browser-studio.py
          python scripts/browser-taxi.py
          python scripts/browser-web-red.py
          npm run check:deploy
      - name: Save tested source only on feature branch
        run: |
          git config user.name 'Vertex Quality'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md package.json vertex/dist vertex/tools/app-release.test.cjs android/app/src/main/assets/site
          git rm -r .ci/red-taxi
          git commit -m 'feat: red web palette and internal Vertex Taxi demo on current Host Studio'
          git archive --format=zip HEAD -o artifacts/Vertex-Red-Taxi-Source.zip
          git rev-parse HEAD > artifacts/quality/source-commit.txt
          node scripts/package-canva.cjs
          sha256sum artifacts/Vertex-Canva-Latest.html > artifacts/quality/canva.sha256
          git push origin HEAD:studio-red-taxi-20260929
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertex-red-taxi-reviewed
          path: |
            artifacts/quality/
            artifacts/studio/
            artifacts/Vertex-Canva-Latest.html
            artifacts/Vertex-Red-Taxi-Source.zip
          retention-days: 14
          if-no-files-found: error
