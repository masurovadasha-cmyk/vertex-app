name: VERTEX VISION Supabase Auth/RLS E2E

on:
  pull_request:
    branches: [master]
    paths:
      - 'vision/**'
      - 'package.json'
      - '.github/workflows/vision-supabase-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-supabase-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VISION_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.VISION_CANDIDATE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install project dependencies
        run: |
          set -euo pipefail
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          mkdir -p artifacts/local-supabase .vision-supabase
      - name: Verify immutable candidate checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VISION_CANDIDATE_SHA"
      - name: Start pinned local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd .vision-supabase
          npx --yes supabase@2.119.0 init
          npx --yes supabase@2.119.0 start
          STATUS_ENV="$(npx --yes supabase@2.119.0 status -o env)"
          eval "$STATUS_ENV"
          LOCAL_ANON="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          LOCAL_SERVICE="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "${DB_URL:-}"
          test -n "$LOCAL_ANON"
          test -n "$LOCAL_SERVICE"
          {
            echo "LOCAL_SUPABASE_API_URL=$API_URL"
            echo "LOCAL_SUPABASE_DB_URL=$DB_URL"
            echo "LOCAL_SUPABASE_ANON_KEY=$LOCAL_ANON"
            echo "LOCAL_SUPABASE_SERVICE_KEY=$LOCAL_SERVICE"
          } >> "$GITHUB_ENV"
      - name: Run genuine Supabase Auth, Worker and direct-RLS E2E
        run: node vision/staging/local-supabase-e2e.mjs artifacts/local-supabase/e2e.json
      - name: Verify sanitized evidence
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('artifacts/local-supabase/e2e.json','utf8'));
          if(report.status!=='passed'||report.syntheticOnly!==true||report.backend!=='local-supabase'||report.productionChanged!==false)throw Error('invalid local E2E report');
          if(report.sourceCommit!==process.env.VISION_CANDIDATE_SHA)throw Error('candidate evidence mismatch');
          const required=['supabase-auth-admin-create','password-sign-in','database-migrations','runtime-readiness','worker-health','worker-readyz','public-auth-config','server-session-scopes','server-context','guest-create-denied','idempotent-create','stale-version-conflict','check-in','check-out','separate-cleaner-execute','cleaner-verify-denied','separate-quality-verify','final-completed-ready','guest-direct-rls','staff-direct-rls-deny'];
          if(!required.every(check=>report.checks?.includes(check)))throw Error('incomplete local E2E evidence');
          JS
      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          cd .vision-supabase
          npx --yes supabase@2.119.0 stop --no-backup || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Vertex-Vision-Supabase-E2E-${{ env.VISION_CANDIDATE_SHA }}
          path: artifacts/local-supabase/
          retention-days: 30
          if-no-files-found: error
