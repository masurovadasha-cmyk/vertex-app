name: VERTEX Engineers Prototype APK
on:
  push:
    branches: ["vertex-engineers-prototype-0.3"]
    paths:
      - "vertex-engineers/ui/app/**"
      - "android-engineers/**"
      - ".github/workflows/vertex-engineers-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Engineers web assets
        run: |
          rm -rf android-engineers/app/src/main/assets/site
          mkdir -p android-engineers/app/src/main/assets/site
          cp -R vertex-engineers/ui/app/. android-engineers/app/src/main/assets/site/
      - name: Build debug APK
        working-directory: android-engineers
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f android-engineers/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-engineers/app/build/outputs/apk/debug/app-debug.apk > android-engineers/app/build/outputs/apk/debug/VERTEX-Engineers-Prototype.apk.sha256
          cp android-engineers/app/build/outputs/apk/debug/app-debug.apk android-engineers/app/build/outputs/apk/debug/VERTEX-Engineers-Prototype.apk
          ls -lh android-engineers/app/build/outputs/apk/debug/VERTEX-Engineers-Prototype.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VERTEX-Engineers-Prototype-APK
          path: |
            android-engineers/app/build/outputs/apk/debug/VERTEX-Engineers-Prototype.apk
            android-engineers/app/build/outputs/apk/debug/VERTEX-Engineers-Prototype.apk.sha256
          if-no-files-found: error
          retention-days: 30
