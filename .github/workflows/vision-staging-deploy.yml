name: VERTEX VISION Staging Deploy

on:
  workflow_dispatch:
  push:
    branches: ['vision-foundation-rc-*']
    paths:
      - 'vision/**'
      - 'docs/architecture/**'
      - '.github/workflows/vision-staging-deploy.yml'

permissions:
  contents: read

concurrency:
  group: vertex-vision-staging
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VISION_STAGING_URL: ${{ vars.VISION_STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
      - name: Verify RC sources
        run: npm test
      - name: Build Cloudflare staging Worker
        run: npx wrangler deploy --config vision/wrangler.jsonc --dry-run
      - name: Deploy only the dedicated VISION staging Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare staging deployment skipped because staging credentials are not configured in GitHub."
            exit 0
          fi
          npx wrangler deploy --config vision/wrangler.jsonc --keep-vars
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify staging health when a URL is configured
        if: steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VISION_STAGING_URL:-}" ]; then
            echo "::notice::Deployment completed, but VISION_STAGING_URL is not configured; external health verification skipped."
            exit 0
          fi
          base="${VISION_STAGING_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/health" | tee vision-staging-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('vision-staging-health.json'));if(x.service!=='VERTEX VISION'||x.environment!=='staging')process.exit(1)"
      - name: Record staging result
        if: always()
        shell: bash
        run: |
          {
            echo "## VERTEX VISION staging"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Dedicated Worker: \`vertex-vision-staging\`"
            echo "- Production Worker changed: **no**"
            echo "- Deploy attempted: \`${{ steps.deploy.outputs.deployed || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
