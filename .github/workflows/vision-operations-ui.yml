name: VERTEX VISION Operations UI
on:
  push:
    branches: ['vision-foundation-rc-ui-*']
  pull_request:
    branches: [master, vision-foundation-rc-0.1]
    paths: ['vision/**', '.github/workflows/vision-operations-ui.yml']
permissions:
  contents: read
concurrency:
  group: vision-operations-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and browser test dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Existing regression tests including new snapshot and client checks
        run: npm test
      - name: Browser journey against real local migrations and RLS
        run: node vision/tools/verify-operations-ui.mjs
      - name: Compile staging Worker and exact UI assets without deployment
        run: npx wrangler deploy --config vision/wrangler.jsonc --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-operations-ui-evidence-${{ github.sha }}
          path: .vision-build/operations-ui-evidence/
          if-no-files-found: warn
          retention-days: 14
