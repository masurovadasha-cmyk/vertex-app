name: VERTEX VISION Production Promotion Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - 'vision/production/**'
      - 'vision/release/**'
      - 'vision/assembly/**'
      - '.github/workflows/vision-promotion-gate.yml'
  push:
    branches: ['vision-foundation-rc-*']
    paths:
      - 'vision/production/**'
      - 'vision/release/**'
      - 'vision/assembly/**'
      - '.github/workflows/vision-promotion-gate.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate source commit validated by every evidence run
        required: true
        type: string
      assembly_run_id:
        description: Integrated Assembly workflow run ID
        required: true
        type: string
      rc2_run_id:
        description: RC2 Production Safety workflow run ID
        required: true
        type: string
      cloud_e2e_run_id:
        description: Real Staging Auth E2E workflow run ID
        required: true
        type: string
      production_backup_run_id:
        description: Production Backup/Restore workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vision-promotion-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Prove promotion is blocked by default
        run: node vision/production/evaluate-promotion.mjs --policy-only

  trusted-controller:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require protected master release controller
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          [[ "${{ inputs.candidate_sha }}" =~ ^[a-f0-9]{40}$ ]]

  evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: trusted-controller
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: master
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Checkout immutable candidate separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
          path: candidate
      - name: Validate trusted controller and candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - name: Verify evidence workflow identities before downloading artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ASSEMBLY_RUN_ID: ${{ inputs.assembly_run_id }}
          RC2_RUN_ID: ${{ inputs.rc2_run_id }}
          CLOUD_RUN_ID: ${{ inputs.cloud_e2e_run_id }}
          BACKUP_RUN_ID: ${{ inputs.production_backup_run_id }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          const repo=process.env.GITHUB_REPOSITORY,candidate=process.env.CANDIDATE_SHA;
          const expected=[
            ['ASSEMBLY_RUN_ID','VERTEX VISION Integrated Assembly','.github/workflows/vision-assembly.yml'],
            ['RC2_RUN_ID','VERTEX VISION RC2 Production Safety','.github/workflows/vision-rc2-safety.yml'],
            ['CLOUD_RUN_ID','VERTEX VISION Real Staging Auth E2E','.github/workflows/vision-cloud-e2e.yml'],
            ['BACKUP_RUN_ID','VERTEX VISION Production Backup Restore Evidence','.github/workflows/vision-production-backup-restore.yml']
          ];
          for(const [envName,name,path] of expected){
            const id=process.env[envName];
            if(!/^\d+$/.test(id||''))throw Error('Invalid workflow run id: '+envName);
            const response=await fetch(`https://api.github.com/repos/${repo}/actions/runs/${id}`,{
              headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'}
            });
            if(!response.ok)throw Error('Unable to read evidence run: '+envName);
            const run=await response.json();
            if(run.name!==name||run.path!==path||run.event!=='workflow_dispatch'||run.head_branch!=='master'||run.conclusion!=='success'||run.repository?.full_name!==repo)
              throw Error('Untrusted evidence workflow run: '+envName);
          }
          JS
      - name: Prepare evidence directories
        run: mkdir -p evidence/assembly evidence/rc2 evidence/cloud evidence/backup artifacts/promotion
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.assembly_run_id }}
          pattern: Vertex-Vision-Integrated-Assembly-*
          merge-multiple: true
          path: evidence/assembly
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rc2_run_id }}
          pattern: Vertex-Vision-RC2-Safety-*
          merge-multiple: true
          path: evidence/rc2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.cloud_e2e_run_id }}
          pattern: Vertex-Vision-Real-Staging-E2E-*
          merge-multiple: true
          path: evidence/cloud
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.production_backup_run_id }}
          pattern: Vertex-Vision-Production-Backup-Restore-*
          merge-multiple: true
          path: evidence/backup
      - name: Evaluate immutable promotion evidence with trusted policy
        env:
          VISION_PROMOTION_EVIDENCE_DIR: evidence
          VISION_PROMOTION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VISION_PROMOTION_CANDIDATE_ROOT: candidate
        run: |
          set -o pipefail
          node vision/production/evaluate-promotion.mjs | tee artifacts/promotion/evaluation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Vertex-Vision-Promotion-Evaluation-${{ inputs.candidate_sha }}
          path: artifacts/promotion/
          retention-days: 30
          if-no-files-found: error
