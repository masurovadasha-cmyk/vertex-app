name: Vertex App CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
concurrency:
  group: vertex-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          npm install
          npx --yes pnpm@11.19.0 --dir vision install --frozen-lockfile
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium
      - name: Unit, server and release checks
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          npm test 2>&1 | tee artifacts/quality/node-tests.log
      - name: Verify every generated Android asset
        run: node scripts/check-android-sync.cjs
      - name: Browser regressions including current Host Studio and taxi
        run: |
          python scripts/browser-quality.py
          python scripts/browser-studio.py
          python scripts/browser-taxi.py
          python scripts/browser-web-red.py
          python scripts/browser-vision.py
      - name: Cloudflare dry run without deployment
        run: |
          set -o pipefail
          npm run check:deploy 2>&1 | tee artifacts/quality/cloudflare-dry-run.log
      - name: Package current Canva preview
        run: |
          node scripts/package-canva.cjs
          git rev-parse HEAD > artifacts/quality/source-commit.txt
      - name: Verify unified live website and every public asset after native Cloudflare deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: python scripts/browser-vision.py --live
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vertex-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/quality/
            artifacts/studio/
            artifacts/vision/
            artifacts/Vertex-Canva-Latest.html
          retention-days: 14
          if-no-files-found: ignore
